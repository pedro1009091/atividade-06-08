<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PrimeCell - Contato</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>PrimeCell</h1>
        <p>Celulares e tecnologia para o seu dia a dia</p>
    </header>

    <nav>
        <a href="index.html">Início</a>
        <a href="produtos.html">Produtos</a>
        <a href="sobre.html">Sobre</a>
        <a href="contato.html" class="pagina-atual">Contato</a>
        <a href="promocoes.html">Promoções</a>
    </nav>

    <main>

        <section class="titulo-pagina">
            <h2>Entre em contato</h2>
            <p>Preencha o formulário abaixo para falar conosco.</p>
        </section>

        <section class="area-formulario">

            <form>

                <label for="nome">Nome:</label>
                <input type="text" id="nome" name="nome">

                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email">

                <label for="telefone">Telefone:</label>
                <input type="tel" id="telefone" name="telefone">

                <label for="assunto">Assunto:</label>
                <input type="text" id="assunto" name="assunto">

                <label for="mensagem">Mensagem:</label>
                <textarea id="mensagem" name="mensagem" rows="6"></textarea>

                <button type="submit">Enviar</button>

            </form>

        </section>

    </main>

    <footer>
        <p>&copy; 2026 PrimeCell - Todos os direitos reservados.</p>
    </footer>

</body>

</html>
